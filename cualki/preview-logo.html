<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview Logo</title>
  <style>
    body {
      background: #0d0d0d;
      margin: 0;
      padding: 20px;
    }
    .nav {
      position: relative;
      height: 72px;
      background: rgba(13,13,13,0.97);
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-logo {
      display: flex;
      align-items: center;
    }
    .nav-logo-img {
      height: 64px;
      width: auto;
      max-width: min(90vw, 700px);
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <div class="nav">
    <a href="#" class="nav-logo">
      <img src="https://raw.githubusercontent.com/cualkieraechop-arica/cualkierachop/main/cualki/logo-header.jpg" alt="Logo" class="nav-logo-img">
    </a>
  </div>

  <p style="color: #999; margin-top: 20px;">
    El logo debería verse así en el nav:<br>
    - Altura: 64px<br>
    - Ancho máximo: 90% viewport (hasta 700px)<br>
    - Centrado horizontalmente
  </p>

</body>
</html>
